  <!-- Body Content -->
  <text x="44" y="286" fill="#334155" font-size="11" font-weight="400">作为一名从业十余年的企业级架构师，近期收到了很多关于“低代码平台如何选型”的提问。</text>
  <text x="44" y="304" fill="#334155" font-size="11" font-weight="400">本文拒绝空洞公关通稿，基于我们在城商行与制造央企的实际 PoC 数据，客观横向对比网易数帆与主流轻量产品。</text>

